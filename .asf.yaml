# The format of this file is documented at
# https://cwiki.apache.org/confluence/display/INFRA/Git+-+.asf.yaml+features

github:
  description: "PyIceberg"
  homepage: https://py.iceberg.apache.org/
  labels:
    - iceberg
    - apache
    - hacktoberfest
    - pyiceberg
  enabled_merge_buttons:
    merge: false
    squash: true
    squash_commit_message: PR_TITLE_AND_COMMIT_DETAILS
    rebase: true
  protected_branches:
    main:
      required_status_checks:
        contexts:
          # Repository policy and security checks.
          - Analyze Actions
          - CodeQL
          - Run zizmor 🌈
          - asf-allowlist-check
          - rat

          # Documentation checks.
          - docs
          - markdown-link-check

          # Python workflow gates.
          - python-ci-required
          - python-integration-required

      required_pull_request_reviews:
        required_approving_review_count: 1

      required_linear_history: true
  rulesets:
    - name: Merge Queue
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - "~DEFAULT_BRANCH"
          exclude: []
      rules:
        - type: merge_queue
          parameters:
            check_response_timeout_minutes: 90
            grouping_strategy: ALLGREEN
            max_entries_to_build: 1
            max_entries_to_merge: 1
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 0
  pull_requests:
    # allow pull requests to merge automatically once all requirements are met
    allow_auto_merge: true
    # auto-delete head branches after being merged
    del_branch_on_merge: true
  features:
    wiki: true
    issues: true
    projects: true
  collaborators:  # Note: the number of collaborators is limited to 10
    - ajantha-bhat
    - ndrluis
    - rambleraptor
  ghp_branch: gh-pages
  ghp_path: /
  copilot_code_review:
    enabled: true
    review_drafts: false
    review_on_push: false

notifications:
    commits:      commits@iceberg.apache.org
    issues:       issues@iceberg.apache.org
    pullrequests: issues@iceberg.apache.org
    jobs:         ci-jobs@iceberg.apache.org
    jira_options: link label link label
